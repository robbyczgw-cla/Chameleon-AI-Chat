name: Build Android APK

on:
  push:
    branches:
      - main
      - 'claude/*'
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '17'
  ANDROID_SDK_VERSION: '35'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platforms;android-35'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci

      - name: Create web assets placeholder
        run: |
          # Create minimal out folder for cap sync (app loads from URL, not bundled)
          mkdir -p out
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Chameleon AI</title></head><body></body></html>' > out/index.html

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Fix Capacitor generated files
        run: |
          # Fix AGP version in generated files (Capacitor may generate wrong versions)
          sed -i "s/gradle:8\.[0-9]*\.[0-9]*/gradle:8.2.2/g" android/capacitor-cordova-android-plugins/build.gradle || true
          sed -i "s/VERSION_21/VERSION_17/g" android/capacitor-cordova-android-plugins/build.gradle || true
          sed -i "s/VERSION_21/VERSION_17/g" android/app/capacitor.build.gradle || true
          sed -i "s/compileSdk.*36/compileSdk = 35/g" android/capacitor-cordova-android-plugins/build.gradle || true
          sed -i "s/targetSdkVersion.*36/targetSdkVersion = 35/g" android/capacitor-cordova-android-plugins/build.gradle || true
          echo "Fixed Capacitor generated files"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Get version info
        id: version
        run: |
          VERSION=$(grep -oP 'versionName "\K[^"]+' android/app/build.gradle || echo "1.0.0")
          BUILD=$(grep -oP 'versionCode \K\d+' android/app/build.gradle || echo "1")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT

      - name: Upload Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: chameleon-ai-debug-v${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: chameleon-ai-release-v${{ steps.version.outputs.version }}-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Generate build summary
        run: |
          echo "## Android Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build Type | ${{ github.event.inputs.build_type || 'debug' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Number | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Min SDK | 33 (Android 13) |" >> $GITHUB_STEP_SUMMARY
          echo "| Target SDK | 35 (Android 15) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "Download the APK from the Artifacts section above." >> $GITHUB_STEP_SUMMARY

